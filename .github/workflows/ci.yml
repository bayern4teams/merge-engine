name: CI

# The one verification command (scripts/check.py's own docstring) run on
# GitHub Actions. ADR 0003 documents that git.n4t.com (this project's
# original git host) never became reachable for server-side CI; GitHub
# is used here as the available alternative, invoking exactly
# `python scripts/check.py all` and nothing else, per that ADR's guidance.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,perf,splink,dspy,schema_matching]"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/ui/frontend
        run: npm ci

      - name: Run scripts/check.py all
        run: python scripts/check.py all
