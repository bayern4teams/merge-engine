name: CI

# The one verification command (scripts/check.py's own docstring) run on
# GitHub Actions. ADR 0003 documents that git.n4t.com (this project's
# original git host) never became reachable for server-side CI; GitHub
# is used here as the available alternative, invoking exactly
# `python scripts/check.py all` and nothing else, per that ADR's guidance.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so an idle repo still notices an upstream dependency breaking
    # it. CI only fired on push/PR before, which means a repo nobody touched
    # could rot silently and only reveal it on the next unrelated commit.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Belt to check.py's braces: every stage already runs under its own
    # 30-minute cap, so this only fires if the harness itself wedges. Without
    # it a hung job burned 61 minutes and died as a bare exit 143 with no log.
    # Measured cost of a green run is ~6 min, so 45 is generous, not tight.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      # EVERY extra, not a subset. mypy-baseline.txt was generated with all of
      # them installed (it contains zero `import-not-found` lines), so omitting
      # `dq` alone made `check.py types` report 6 phantom great_expectations
      # errors that cannot be reproduced in a complete environment.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,perf,splink,schema_matching,dq,lineage,swarm]"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/ui/frontend
        run: npm ci

      - name: Run scripts/check.py all
        run: python scripts/check.py all
