name: Bootstrap

# Proves a fresh clone actually works, which nothing verified before.
#
# scripts/check.py's own comment says the "venv-from-scratch and docker-build
# smoke tests run in CI instead" of in `check.py all`. The docker half exists
# (docker.yml); this venv half never did. README now tells every new user that
# `python scripts/bootstrap.py` is the required first step, so it had better
# be a step that works on a machine that has never seen this project.
#
# It also covers the failure this repo was actually found in: .git/hooks/ was
# empty, so all 13 configured hooks had never run once. Bootstrap installing
# them is asserted below, not assumed.
#
# Path-filtered: a full bootstrap is minutes, and only these files can change
# whether it succeeds.
on:
  push:
    paths: &bootstrap_paths
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "scripts/bootstrap.py"
      - "scripts/refresh_graphs.py"
      - ".pre-commit-config.yaml"
      - "src/ui/frontend/package.json"
      - "src/ui/frontend/package-lock.json"
      - ".github/workflows/bootstrap.yml"
  pull_request:
    paths: *bootstrap_paths
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.11 is a hard constraint (CLAUDE.md). bootstrap.py refuses to build a
      # venv on anything older, so pinning here tests the intended path rather
      # than whatever the runner happens to ship.
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Bootstrap from a clean checkout
        run: python scripts/bootstrap.py

      # Assert what bootstrap claims to have done. A script that exits 0
      # having silently skipped half its steps is exactly what this is for.
      - name: The venv exists and can import the app
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c "import src.api.main; print('app imports')"

      - name: Git hooks are installed
        run: |
          test -f .git/hooks/pre-commit  || { echo "pre-commit hook missing"; exit 1; }
          test -f .git/hooks/post-commit || { echo "post-commit hook missing"; exit 1; }
          echo "both hooks present"

      - name: The frontend was actually built
        # A fresh clone has no UI until dist/ exists; without it src/api/main.py
        # degrades to an {"status": "api-only"} stub with no visible error.
        run: |
          test -d src/ui/frontend/dist || { echo "dist/ not built"; exit 1; }
          test -f src/ui/frontend/dist/index.html
          echo "dist/ built"

      - name: .env was created from the example
        run: test -f .env && echo ".env present"

      # graphify/graft/codebase-memory-mcp are not installed on the runner. A clone
      # without them must still bootstrap, but refresh_graphs must SAY the graphs
      # were not built (exit 1 + "NOT BUILT"), never report success: bootstrap once
      # printed "Code graphs ready" having built nothing.
      - name: Graph refresh reports missing tools instead of hiding them
        run: |
          rc=0
          .venv/bin/python scripts/refresh_graphs.py || rc=$?
          cat .tmp/refresh_graphs.log
          test "$rc" -eq 1
          grep -q "NOT BUILT" .tmp/refresh_graphs.log
