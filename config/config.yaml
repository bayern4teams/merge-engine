# =============================================================================
# merge-engine Configuration
# =============================================================================
# Minimal pipeline configuration. Origin databases are loaded dynamically via
# the Gradio UI at runtime — they are NOT stored in config files.
#
# All origin and destination credentials are entered interactively in the UI.
# Only pipeline-level settings (LLM, retry, extraction defaults) are stored here.
# =============================================================================

# ── Destination (PostgreSQL) ───────────────────────────────────────────────
# Destination connection details are provided via the Gradio UI at runtime.
# These env-var placeholders serve as defaults for the UI form.
destination:
  type: clickhouse
  host: ""              # Provided at runtime via UI
  port: 8123            # Provided at runtime via UI
  user: ""              # Provided at runtime via UI
  password: ""          # Provided at runtime via UI
  database: ""          # Provided at runtime via UI
  schema: "public"      # Default schema (can be extended dynamically)

# ── LLM Configuration ──────────────────────────────────────────────────────
llm:
  provider: "openai"      # "openai" | "azure" | "anthropic"
  model: "Qwen/Qwen3.6-35B-A3B-FP8"
  # Tried in this exact order (LLMClient.call) whenever the active model
  # hits a quota/billing error — a same-account retry can't recover from
  # that, so the client advances to the next entry instead of failing.
  fallback_models:
    - "qwen3.5-35b-a3b"
    - "qwen3.5-122b-a10b"
    - "qwen3.5-397b-a17b"
    - "qwen3.5-flash"
    - "qwen3.5-flash-2026-02-23"
    - "qwen3.5-plus"
    - "qwen3.5-plus-2026-04-20"
    - "qwen3.5-plus-2026-02-15"
  api_key: "${LLM_API_KEY}"
  base_url: "http://10.10.9.45:8000/v1"
  temperature: 0.2      # Deterministic outputs preferred
  structured_output: true         # Request JSON-object response_format (disable if endpoint rejects it)
  entity_resolution_enabled: true # LLM judgment for borderline entity pairs (0.70-0.95 band)
  field_mapping_enabled: true     # LLM mapping for fields the heuristic can't map confidently
  # Phase A5: the in-memory cache (always on) dies with the process -- this
  # is the durable second layer (config/.llm_cache.sqlite3, gitignored)
  # underneath it, keyed on the exact same normalised-prompt hash. Disable
  # only to compare a cold run against a warm one; disabling it never
  # changes an answer, only whether one is reused.
  persistent_cache_enabled: true
  persistent_cache_ttl_days: 30    # 0 = never expire
  persistent_cache_max_rows: 50000

# ── Retry Configuration ───────────────────────────────────────────────────
retry:
  max_attempts: 3
  backoff: exponential  # "exponential" | "linear"
  min_backoff_seconds: 1
  max_backoff_seconds: 30

# ── Extraction Defaults ───────────────────────────────────────────────────
extraction:
  default_batch_size: 1000
  max_batch_size: 10000

# ── Scope Planning (scoped/"everything about X" merges) ────────────────────
scope:
  # Longest join-path the BFS path-finder will consider from the subject
  # table to a dependent table.
  max_hops: 6
  # Distinct values sampled per column when verifying a candidate join
  # edge's inclusion dependency.
  join_graph_sample_size: 500

# ── Entity Resolution: Splink engine (B.4) ──────────────────────────────────
# The default engine is NOT declared here. The promotion surface is the
# per-entity `matching_rules` (currently none), and the code falls back to
# "builtin" when an entity declares no engine — so the effective default is
# builtin until a BP-B4 measured gate pass is recorded in
# tests/eval/last_gate.json. tests/unit/test_splink_default_invariant.py
# enforces that: setting default_engine: splink here while the last measured
# gate outcome is not a pass fails the suite. See ADR 0004 addendum.
splink:
  # Workbench model versions live under this root:
  # <model_store>/<model_name>/v<N>/{model.json,metadata.json}
  model_store: logs/splink_models
  # A prediction-blocking rule that would generate more candidate pairs than
  # this is flagged "⚠ Too broad" by splink_blocking.recommend_prediction_
  # blocking (S-E). 600,000 ≈ a quarter of the 2.4M figure that silently
  # truncated a real run before costed blocking existed (ADR 0014).
  pair_budget: 600000
  # S-P review-band defaults (a *view* over the predictions, not the model's
  # output; the UI can override per request).
  predict:
    match_threshold: 0.5    # score >= this → auto-match band
    exclude_threshold: 0.2  # score <= this → auto-keep-apart band
    review_limit: 200       # review queue rows returned (counts are whole-band)

# ── Tracing (self-hosted Langfuse) ─────────────────────────────────────────
# Tracing is configured purely via environment variables in .env:
#   LANGFUSE_PUBLIC_KEY=<project public key>
#   LANGFUSE_SECRET_KEY=<project secret key>
#   LANGFUSE_HOST=http://localhost:3000
# Start the local stack with:
#   docker compose -f docker/langfuse-compose.yml --env-file docker/langfuse.env up -d
# No secrets belong in this file.
