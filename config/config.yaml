# =============================================================================
# merge-engine Configuration
# =============================================================================
# Minimal pipeline configuration. Origin databases are loaded dynamically via
# the Gradio UI at runtime — they are NOT stored in config files.
#
# All origin and destination credentials are entered interactively in the UI.
# Only pipeline-level settings (LLM, retry, extraction defaults) are stored here.
# =============================================================================

# ── Destination (PostgreSQL) ───────────────────────────────────────────────
# Destination connection details are provided via the Gradio UI at runtime.
# These env-var placeholders serve as defaults for the UI form.
destination:
  type: postgresql
  host: ""              # Provided at runtime via UI
  port: 5432            # Provided at runtime via UI
  user: ""              # Provided at runtime via UI
  password: ""          # Provided at runtime via UI
  database: ""          # Provided at runtime via UI
  schema: "public"      # Default schema (can be extended dynamically)

# ── LLM Configuration ──────────────────────────────────────────────────────
llm:
  provider: openai      # "openai" | "azure" | "anthropic"
  model: gpt-4o
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"  # Optional: for Azure or custom endpoints
  temperature: 0.0      # Deterministic outputs preferred

# ── Retry Configuration ───────────────────────────────────────────────────
retry:
  max_attempts: 3
  backoff: exponential  # "exponential" | "linear"
  min_backoff_seconds: 1
  max_backoff_seconds: 30

# ── Extraction Defaults ───────────────────────────────────────────────────
extraction:
  default_batch_size: 1000
  max_batch_size: 10000
