# =============================================================================
# merge-engine Configuration
# =============================================================================
# Minimal pipeline configuration. Origin databases are loaded dynamically via
# the Gradio UI at runtime — they are NOT stored in config files.
#
# All origin and destination credentials are entered interactively in the UI.
# Only pipeline-level settings (LLM, retry, extraction defaults) are stored here.
# =============================================================================

# ── Destination (PostgreSQL) ───────────────────────────────────────────────
# Destination connection details are provided via the Gradio UI at runtime.
# These env-var placeholders serve as defaults for the UI form.
destination:
  type: clickhouse
  host: ""              # Provided at runtime via UI
  port: 8123            # Provided at runtime via UI
  user: ""              # Provided at runtime via UI
  password: ""          # Provided at runtime via UI
  database: ""          # Provided at runtime via UI
  schema: "public"      # Default schema (can be extended dynamically)

# ── LLM Configuration ──────────────────────────────────────────────────────
llm:
  provider: "openai"      # "openai" | "azure" | "anthropic"
  model: "qwen3.5-122b-a10b"
  # Tried in this exact order (LLMClient.call) whenever the active model
  # hits a quota/billing error — a same-account retry can't recover from
  # that, so the client advances to the next entry instead of failing.
  fallback_models:
    - "qwen3.5-35b-a3b"
    - "qwen3.5-122b-a10b"
    - "qwen3.5-397b-a17b"
    - "qwen3.5-flash"
    - "qwen3.5-flash-2026-02-23"
    - "qwen3.5-plus"
    - "qwen3.5-plus-2026-04-20"
    - "qwen3.5-plus-2026-02-15"
  api_key: "${LLM_API_KEY}"
  base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
  temperature: 0.2      # Deterministic outputs preferred
  structured_output: true         # Request JSON-object response_format (disable if endpoint rejects it)
  entity_resolution_enabled: true # LLM judgment for borderline entity pairs (0.70-0.95 band)
  field_mapping_enabled: true     # LLM mapping for fields the heuristic can't map confidently

# ── Retry Configuration ───────────────────────────────────────────────────
retry:
  max_attempts: 3
  backoff: exponential  # "exponential" | "linear"
  min_backoff_seconds: 1
  max_backoff_seconds: 30

# ── Extraction Defaults ───────────────────────────────────────────────────
extraction:
  default_batch_size: 1000
  max_batch_size: 10000

# ── Tracing (self-hosted Langfuse) ─────────────────────────────────────────
# Tracing is configured purely via environment variables in .env:
#   LANGFUSE_PUBLIC_KEY=<project public key>
#   LANGFUSE_SECRET_KEY=<project secret key>
#   LANGFUSE_HOST=http://localhost:3000
# Start the local stack with:
#   docker compose -f docker/langfuse-compose.yml --env-file docker/langfuse.env up -d
# No secrets belong in this file.
