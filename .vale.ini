# Vale config (J12). Google style: sentence-case headings, no needless
# doubles, concrete-over-vague — a good base for the simple-English rule J5.
# Google.Vocab (below) is where GLOSSARY.md terms go (prompt 2 fills it):
# accept.txt entries become the canonical spellings (Vale.Terms), so e.g.
# "Ground truth" is enforced against "groundtruth"/"GroundTruth".
#
# Scope note: CI runs vale only on the J12 doc set (docs.yml); this section
# pattern covers all .md so local/editor runs lint whatever you have open.
StylesPath: .vale
MinAlertLevel = suggestion

Packages: Google

[*.md]
BasedOnStyles = Vale, Google
Google.Vocab = project
