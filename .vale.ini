# Vale config (J12). Google style: sentence-case headings, no needless
# doubles, concrete-over-vague — a good base for the simple-English rule J5.
# Vocab (below) is where GLOSSARY.md terms live (prompt 2 filled
# config/vocabularies/project/accept.txt from GLOSSARY.md): accept.txt entries
# become the canonical spellings (Vale.Terms), so e.g. "Ground truth" is
# enforced against "groundtruth"/"GroundTruth".
#
# Fix (docs pass 2026-11-26): the vocabulary used to be enabled with
# `Google.Vocab = project`, which Vale >= 3 rejects as an invalid rule level
# (warning W101) and switches OFF silently — the seeded accept.txt enforced
# nothing. The correct key is the top-level `Vocab` (a vocabulary *name*).
#
# Scope note: CI runs vale only on the J12 doc set (docs.yml); this section
# pattern covers all .md so local/editor runs lint whatever you have open.
StylesPath: .vale
MinAlertLevel = suggestion

Packages: Google

Vocab = project

# C5 EXCEPTIONS (docs pass 2026-11-26 — approved by the owner's approval of
# this docs pass's plan; review date: next docs audit). Reason: the repo-wide
# house style — set by AGENTS.md itself and every legacy report — uses spaced
# em-dashes (" — "), punctuation outside quotes, `e.g.`, and compact units
# like `8s`. The Google package flags those at error level. The alternative
# was rewriting ~700 spaced em-dashes inside evidence documents (violates
# "preserve evidence verbatim"), so the four rules are lowered to warning
# instead of deleting them or exempting files. New documents follow the same
# house style deliberately.
[*.md]
BasedOnStyles = Vale, Google
Google.EmDash = warning
Google.Quotes = warning
Google.Latin = warning
Google.Units = warning
