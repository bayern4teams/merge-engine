[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-engine"
version = "0.1.0"
description = "Multi-source data migration, deduplication, and unification into Databricks with human oversight"
requires-python = ">=3.11"
dependencies = [
    # LangGraph orchestration
    "langgraph>=0.2.0",
    "langgraph-checkpoint",
    "langgraph-checkpoint-sqlite",
    # LLM integration
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    # MCP server
    "mcp>=1.0.0",
    # Database connectors
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "pymongo>=4.6.0",
    "databricks-sql-connector>=3.0.0",
    "clickhouse-connect>=0.7.0",
    # Configuration & validation
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # .env loading (main.py, src/main.py, config_loader.py all import this;
    # it was never actually declared here, so a from-scratch bootstrap left
    # every ${ENV_VAR} placeholder in config.yaml silently unexpanded --
    # discovered live 2026-08-10 chasing a spurious "invalid API key" error
    # that was really "the key was never read from .env at all".
    "python-dotenv>=1.0.0",
    # Utilities
    "tenacity>=8.2.0",
    "uuid-utils>=0.8.0",
    # UI (FastAPI serves the built React frontend)
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # Observability (self-hosted Langfuse — docker/langfuse-compose.yml).
    # Pinned to the v4.x OTel-based SDK explicitly (Part 1.5 C.1): the
    # installed SDK is 4.x while the compose stack pins server images to
    # `:3` (langfuse/langfuse:3, langfuse-worker:3) — verified live that
    # v4's OTLP export round-trips against that v3 server (emit -> flush
    # -> read back via client.api.trace.get() all succeeded), so the
    # server images were deliberately left as-is rather than upgraded.
    "langfuse>=4.0,<5",
    # Logging
    "structlog>=24.0.0",
    # Per-run extraction spool: rows live here instead of in graph state.
    "duckdb>=1.0.0",
    # ADR 0009: in-process traversal over P-1's metadata tables (P-8 graph
    # view, P-9 entity subgraph traversal) -- core V3 discovery
    # functionality, not an optional accelerator like the Valentine/
    # Desbordante/datasketch/Great Expectations extras above.
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    # pytest has no per-test timeout of its own. Without one, a single hung
    # test takes the whole suite down in silence: CI emitted 2026 progress
    # dots and then nothing for 30 minutes, with no way to say which test was
    # stuck. This names the test and prints the line it is stuck on.
    "pytest-timeout>=2.3.0",
    # Pinned to a minor series, not floated. `ruff>=0.4.0` let CI resolve the
    # newest release (0.16.8) while local envs sat on 0.15.x, so lint rules
    # differed between them -- exactly the "passes locally, fails in CI"
    # discrepancy check.py's docstring says must never exist. Both tools gate
    # `check.py`, so a rule change in either is a CI break with no code change.
    "mypy~=2.3.1",
    "ruff~=0.16.8",
    "pre-commit>=3.6.0",
]
# Phase 0 §0.1: every branch's dependency is pre-declared here so no branch
# ever has to edit pyproject.toml — the single worst six-way merge conflict
# file. Each group belongs to exactly one planned branch (see
# docs/plans/ — the harness-foundation plan's branch ownership table);
# installing one does not pull in another branch's engine.
dspy = ["dspy-ai>=2.6"]
splink = ["splink>=4.0.0"]
dq = ["great-expectations>=1.0.0"]
lineage = ["sqlglot>=25.0.0"]
swarm = ["langgraph-swarm>=0.0.11"]
# numpy<2.5: 2.5.0's bundled __init__.pyi started using PEP 695 `type X = ...`
# syntax, which mypy refuses to parse under this project's `python_version =
# "3.11"` target -- it halts the ENTIRE `mypy src` run at that stub's parse
# error, checking nothing beyond import resolution (verified live 2026-09-14:
# 93 source files went unchecked, only surfaced when a stale Windows-path
# mypy-baseline.txt was independently found needing a refresh anyway). Not a
# fix-v3 change; pinned narrowly here so a fresh clone doesn't silently lose
# type coverage the same way. Revisit once mypy targets >=3.12 or this
# project's own minimum Python does.
perf = ["numpy>=1.26,<2.5", "pandas>=2.2"]
# ADR 0005 (docs/decisions/0005-adopt-valentine-schema-matching.md): P-7's
# first-pass schema matcher, ahead of the deterministic heuristic pass and
# the LLM.
schema_matching = ["valentine>=0.2", "pandas>=2.2"]

[project.scripts]
merge-engine = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Phase 0 Sec 0.2: previously only the default E4/E7/E9/F set ran (ruff's
# bare default), so an entire category of real bugs (bare except:pass,
# unsorted/unused imports, mutable-default-argument footguns) was never
# checked. Selected per the harness-foundation plan; RUF/SIM/B findings that
# need a human judgment call (not auto-fixable) are ignored per-rule below
# with a reason, rather than hand-editing files across the codebase in one
# unreviewed pass - shrink this list over time, never grow it silently.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by `line-length` + formatter, not this
]

[tool.ruff.lint.per-file-ignores]
# Test files intentionally construct fixtures/mocks in ways SIM/B flag
# (broad excepts to assert failure paths, long literal dicts).
#
# Phase 0 Sec 0.2: enabling the wider rule set above found 503 findings.
# `src/` was fixed to zero by hand, one finding at a time (see the git log
# around this change) — real dead-code removals, `from exc` chaining,
# `zip(strict=True)` where the invariant was verified, contextlib.suppress
# conversions. The remaining ~96 findings are entirely in tests/ and
# scripts/ (one-off golden-generation scripts, not the runtime pipeline) and
# were judged lower value per finding reviewed manually in one session
# against a codebase this agent does not have full behavioural context on —
# ignored here explicitly rather than silently, the same ratchet principle
# applied to mypy below. Shrink this list over time; never add a rule to it
# without a reason, and never widen it to cover src/.
"tests/**" = [
    "SIM117", "B011",
    "RUF059",  # unpacked-but-unused tuple members in assertions (readability)
    "F841",    # unused locals in test setup/fixtures
    "B007",    # unused loop vars in test iteration
    "RUF012",  # mutable class defaults in test doubles/mocks
    "B905",    # zip() without strict= in test data assembly
    "SIM105",  # try/except/pass in test cleanup
    "RUF013",  # implicit Optional in test helper signatures
    "B017",    # pytest.raises(Exception) - intentionally broad in some tests
    "RUF005",  # list concatenation in test fixtures
    "SIM108", "SIM116",
]
"scripts/**" = [
    "RUF059", "F841", "B007", "RUF012", "B905", "SIM105", "RUF013",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Phase 0 Sec 0.7. "unit"/"integration" are applied automatically by
# tests/conftest.py's pytest_collection_modifyitems based on directory, so
# individual test files never need a decorator for those two. "live" (needs
# real Docker containers or a live LLM endpoint) and "slow" are opt-in via
# @pytest.mark.live / @pytest.mark.slow on the specific tests that need them.
# `-m "not live"` is the default exclusion; nothing is marked `live` yet, so
# this is currently a no-op, not a claim that live coverage exists in pytest.
markers = [
    "unit: fast, fully-mocked test (auto-applied to everything under tests/unit)",
    "integration: exercises multiple components together, still mocked at the DB/LLM boundary (auto-applied to everything under tests/integration)",
    "live: requires real Docker containers or a live LLM endpoint; excluded by default",
    "slow: takes non-trivial wall time even without live infra",
]
# --timeout: no single test may hang the suite. The slowest test in this repo
# finishes in well under a second (the whole integration suite runs in ~8s), so
# 120s only ever fires on a genuine hang, never on a slow-but-working test --
# including on a 2-core CI runner. On failure pytest-timeout prints the stack
# of the offending test rather than leaving a blank log.
addopts = "-m \"not live\" --timeout=120"
