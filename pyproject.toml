[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-engine"
version = "0.1.0"
description = "Multi-source data migration, deduplication, and unification into Databricks with human oversight"
requires-python = ">=3.11"
dependencies = [
    # LangGraph orchestration
    "langgraph>=0.2.0",
    "langgraph-checkpoint",
    "langgraph-checkpoint-sqlite",
    # LLM integration
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    # MCP server
    "mcp>=1.0.0",
    # Database connectors
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.6.0",
    "databricks-sql-connector>=3.0.0",
    # Configuration & validation
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # Utilities
    "tenacity>=8.2.0",
    "uuid-utils>=0.8.0",
    # UI (FastAPI serves the built React frontend)
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # Observability (self-hosted Langfuse — docker/langfuse-compose.yml)
    "langfuse>=3.0.0",
    # Logging
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
merge-engine = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"