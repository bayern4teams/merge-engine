# Runs the merge-engine app container built from the repo-root Dockerfile
# (Part 1.6.C). Origins and the destination are NOT modelled as compose
# services here — per docs/architecture/overview.md they are entered live
# through the Setup screen at runtime, not wired up in advance, so this file
# only has one real job: run the app itself and hand it credentials/tracing
# config the same way the non-Docker `python -m src.main` path does.
#
# Usage:
#   cp .env.example .env   # fill in LLM_API_KEY at minimum
#   docker compose -f docker/app-compose.yml up --build
#
# Then open http://localhost:7860 and configure origins/destination as usual.
#
# To send traces to this project's self-hosted Langfuse stack
# (docker/langfuse-compose.yml, started separately), set LANGFUSE_HOST in
# .env to http://host.docker.internal:3000 — Langfuse's own compose file
# already publishes port 3000 to the host, so the app container reaches it
# through Docker's host-gateway alias below rather than joining that
# stack's internal compose network.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    env_file:
      - ../.env
    extra_hosts:
      # Lets LANGFUSE_HOST=http://host.docker.internal:3000 resolve on Linux
      # too, not just Docker Desktop (Windows/Mac already do this natively).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
